server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects keep relative to the request host/scheme (works behind a proxy/CDN).
    absolute_redirect off;

    # ---- Compression (page speed is a ranking signal) ----------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript
               application/json application/ld+json application/manifest+json
               image/svg+xml font/ttf font/woff font/woff2;

    # ---- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---- Canonical URLs (avoid duplicate content) ---------------------------
    # /home duplicates the homepage
    location = /home  { return 301 /; }
    location = /home/ { return 301 /; }

    # /about/ -> /about (canonical URLs have no trailing slash)
    rewrite ^/(.+)/$ /$1 permanent;

    # Every page is prerendered to <path>/index.html at build time, so serve
    # that file directly (full HTML for crawlers / AI agents / link previews).
    # Unknown URLs get the prerendered 404 page with a real 404 status.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Hashed build assets never change, cache them long-term.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Icons / OG image: cache for a week.
    location ~* \.(png|jpg|jpeg|webp|svg|ico|webmanifest)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 7d;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
